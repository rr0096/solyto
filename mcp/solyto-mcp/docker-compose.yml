services:
  solyto-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3123:3000"   # solo accesible en local; Nginx Proxy Manager lo expone
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
